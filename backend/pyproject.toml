[project]
name = "datanova-extract"
version = "3.0.0"
description = "Enterprise-Grade Multilingual Intelligent Document Understanding Platform"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openpyxl>=3.1.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.3.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tenacity>=8.3.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "aioboto3>=13.0.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
core = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
]
workers = [
    "redis>=5.0.0",
    "arq>=0.26.0",
    "aioboto3>=13.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.3.0",
]
security = [
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "locust>=2.29.0",
    "hypothesis>=6.100.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]
