services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datanova-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - DATABASE_URL=sqlite+aiosqlite:////data/datanova.db
      - FEATURE_STREAMING=true
      - FEATURE_GROUNDING=true
      - FEATURE_HISTORY=true
      - FEATURE_EXPORTS=true
      - FEATURE_BATCH=true
      - FEATURE_EVAL=true
    volumes:
      - datanova_storage:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datanova-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_FEATURE_STREAMING=true
      - NEXT_PUBLIC_FEATURE_GROUNDING=true
      - NEXT_PUBLIC_FEATURE_HISTORY=true
      - NEXT_PUBLIC_FEATURE_EXPORTS=true
      - NEXT_PUBLIC_FEATURE_BATCH=true
      - NEXT_PUBLIC_FEATURE_EVAL=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datanova_storage:
